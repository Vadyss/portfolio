<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Glowing dot in the portfolio's accent colours (amber → rose). -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.75" />
      <stop offset="0.55" stop-color="#fb923c" stop-opacity="0.28" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#fffbeb" />
      <stop offset="0.3" stop-color="#fde68a" />
      <stop offset="0.7" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#fb7185" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#halo)" />
  <circle cx="16" cy="16" r="9.5" fill="url(#core)" />
</svg>
